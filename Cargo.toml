[package]
name = "waydroidsu"
version = "2.0.0"
edition = "2021"
rust-version = "1.74"
description = "WaydroidSU (wsu) — CLI KitsuneMagisk installer, root, module & superuser manager for Waydroid"
license = "GPL-3.0"

[[bin]]
name = "wsu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
lto = true
strip = true
