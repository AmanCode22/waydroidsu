[package]
name = "waydroidsu"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
description = "WaydroidSU (wsu) — CLI KitsuneMagisk installer, root, module & superuser manager for Waydroid"
license = "GPL-3.0"
authors = ["AmanCode22 <amanady125@gmail.com>"]
repository = "https://github.com/AmanCode22/waydroidsu"
readme = "README.md"

[[bin]]
name = "wsu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
lto = true
strip = true

# Debian package (cargo deb) — built by .github/workflows/release.yml
[package.metadata.deb]
maintainer = "AmanCode22 <amanady125@gmail.com>"
depends = "$auto"
recommends = "waydroid"
section = "utils"
priority = "optional"
extended-description = """\
wsu installs and manages KitsuneMagisk (Jordan231111/KitsuneMagisk — \
Magisk v31 base with Zygisk and Kitsune Hide/SuList) inside Waydroid \
straight from the host terminal: root, magisk modules, superuser policy, \
Android app management and hide controls. \
The payload is fetched from the fork's official GitHub releases at \
install time; nothing from the fork is shipped inside this package. \
"""
assets = [["target/release/wsu", "usr/bin/", "755"]]

# RPM package (cargo generate-rpm) — built by .github/workflows/release.yml
[package.metadata.generate-rpm]
summary = "CLI KitsuneMagisk (Zygisk) manager for Waydroid"
description = "Installs and manages KitsuneMagisk inside Waydroid: root, magisk modules, superuser policy, Kitsune Hide/SuList and Zygisk control from the host terminal."
auto-req = "no"
assets = [{ source = "target/release/wsu", dest = "/usr/bin/wsu", mode = "755" }]
