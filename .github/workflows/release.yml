name: Release

# Builds release artifacts (binary tarball, .deb, .rpm, sha256sums) and
# attaches them to the published GitHub release.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install packaging tools
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Collect version and arch names
        id: names
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="waydroidsu") | .version')
          ARCH=${{ matrix.target }}-unknown-linux-gnu
          ARCH=${ARCH%%-*}                      # x86_64 | aarch64
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

      - name: Stage binary tarball
        run: |
          mkdir -p dist/wsu-${{ steps.names.outputs.ver }}
          cp "target/${{ matrix.target }}/release/wsu" "dist/wsu-${{ steps.names.outputs.ver }}/"
          cp README.md LICENSE "dist/wsu-${{ steps.names.outputs.ver }}/"
          tar -czf "dist/wsu-${{ steps.names.outputs.ver }}-${{ steps.names.outputs.arch }}-linux.tar.gz" -C dist "wsu-${{ steps.names.outputs.ver }}"
          rm -rf "dist/wsu-${{ steps.names.outputs.ver }}"

      - name: Build .deb
        run: cargo deb --no-build --no-strip --target ${{ matrix.target }} --output dist/

      - name: Build .rpm
        run: |
          cargo generate-rpm --target ${{ matrix.target }}
          cp target/generate-rpm/*.rpm dist/

      - name: Checksums
        run: |
          cd dist
          sha256sum * > sha256sums.txt

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
